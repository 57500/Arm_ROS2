# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    # 必须 false：URDF 是 SolidWorks 导出的固定值（1.0472 rad/s），
    # 开着会把 joint_limits.yaml 里 100 deg/s 的设置静默压回 60 deg/s。
    # 速度上限由 MoveIt（joint_limits.yaml）+ 硬件（max_joint_vel）保证。
    enforce_command_limits: false

    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

manipulator_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:                   
      joint1: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
      joint2: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
      joint3: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
      joint4: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
      joint5: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
      joint6: {p: 1.0, i: 0.0, d: 0.0, ff_velocity_scale: 1.0}
    allow_nonzero_velocity_at_trajectory_end: true